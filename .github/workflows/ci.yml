name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Miden 0.15 note scripts
        run: cargo run --manifest-path poc/policy-gated-note/rust-fixtures/Cargo.toml
